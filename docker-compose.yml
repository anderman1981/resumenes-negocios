services:
  admin:
    build: ./admin
    container_name: resumenes-admin
    ports:
      - "4322:4322"
    volumes:
      - .:/repo
      # Volumen propio para node_modules del repo (evita usar los binarios del Mac,
      # que no funcionan en Linux). Se instalan dentro del contenedor.
      - repo_node_modules:/repo/node_modules
    environment:
      - REPO_DIR=/repo
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - GH_REPO=${GH_REPO:-anderman1981/resumenes-negocios}
    # Instala las dependencias del repo (sharp, etc.) para el pipeline y arranca el admin.
    command: sh -c "npm --prefix /repo install --omit=dev --no-audit --no-fund && node /admin/server.mjs"
    restart: unless-stopped

volumes:
  repo_node_modules:
